gbif:
  years: [1950, 2024]
  country: ["GB", "IE"]
grid:
  cell_km: 10
  crs_out: "EPSG:27700"
arrival:
  min_events_cell: 2
  window_years: 5
  neigh_radius_cells: 1
  min_support_neigh: 3
  outlier_iso_years: 8
species:
  mink:
    scientific_name: "Neovison vison"
    gbif_rank: "SPECIES"
    folder: "mink"
  vole:
    scientific_name: "Arvicola amphibius"
    gbif_rank: "SPECIES"
    folder: "vole"
cache:
  max_records: 200000
  force_redownload: false
pilot:
  analysis_unit: "grid_all"
  unit_min_tx_obs: 50
  years: [1950, 2024]
  grid_cell_km: 10
  crs_out: "EPSG:27700"
  vole:
    smooth_window: 5
    min_years_active: 6
    baseline_window: 10
    drop_fraction: 0.2
    hold_years: 5
    normalize_by: "taxa"
    normalize_taxa:
      - name: "Mustelidae"
        rank: "FAMILY"
      - name: "Microtus"
        rank: "GENUS"
      - name: "Arvicola amphibius"
        rank: "SPECIES"
      - name: "Ondatra zibethicus"
        rank: "SPECIES"
    normalize_years: [1975, 2024]
    normalize_max_records: 5000
    riparian_tau_km: 5
  mink_P:
    ramp_years: 8
    pre_arrival_leak: 0.0
    scale: 1.0
    gamma: 1.0
    delta_region:
      SCT: [0, 20]
      N_ENG: [0, 15]
      S_ENG_WAL: [0, 12]
  delta_penalty:
    lambda_mag: 0.02
    lambda_tv: 0.05
  pred_scale_re:
    enable: true
    sigma: [0.0, 0.6]
  screen:
    n_draws: 40
    log_mem: true
    adapt_c: true
    K0: 120
    rmax: [0.3, 0.6]
    alpha: [0.0, 0.4]
    disp_mean_km: [5, 25]
    A_over_K: [0.0, 0.2]
    pred_c: [0.3, 1.5]
    pred_h: [15, 60]
    ramp_years: [5, 12]
    pred_scale: [0.6, 3.5]
    gamma: [1.0, 2.0]
    pred_scale_re_sigma: [0.0, 0.6]
    delta_region:
      SCT: [0, 20]
      N_ENG: [0, 15]
      S_ENG_WAL: [0, 12]
  compat:
    min_r2_arrival: 0.25
    lag_range: [2, 25]
    min_coverage: 0.15
  abc:
    n_stage1: 30
    n_stage2: 30
    n_stage3: 0
    eps1: 0.90
    eps2: 0.45
    eps3: 0.30
    shortlist: 40
    jitter_sd: 0.05
    seed_prob: 0.5
    seed_prob_refine: 0.65
  ablation:
    enabled: true
    n_draws: 40
    n_cores: 8
    seed: 8201
  ppc:
    n_draws: 10
    seed: 9103
  canonical:
    enabled: true
    root: "outputs/canonical"
    milestone: "0.4"
    wp_id: "WP-0.4.3"
    run_id: ~
    commands:
      - "make pilot"
