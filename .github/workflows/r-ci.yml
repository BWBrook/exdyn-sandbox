name: R CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - name: Install GLPK system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglpk-dev \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2

      - name: Run test suite
        run: make test

      - name: Run package check
        run: make check
