name: R CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::renv
          needs: check

      - name: Restore renv library
        run: R --vanilla -e 'source("renv/activate.R"); renv::restore(prompt = FALSE)'

      - name: Run test suite
        run: make test
